name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # setuptools-scm derives the version from git tags; a shallow clone
      # without tags makes the build fail rather than mis-version.
      - name: Fetch tags for setuptools-scm
        run: git fetch --tags --force --depth=1 || true

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . || pip install -e . --no-deps
          pip install pytest pyyaml

      # No AWS credentials are configured for this job, deliberately. The suite
      # must not depend on live AWS. `live_aws` is already declared as a marker
      # in pyproject.toml for tests that do, and is deselected here — they run
      # from an operator workstation, not CI.
      - name: pytest
        run: python -m pytest -m "not live_aws" --maxfail=0 -q

  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # These two run without installing the package so they still report even
      # if the install job breaks. Both guard changes the scoped-role work makes:
      # payload parity (Phase 0) and cluster IAM containment (Phase 2).
      - name: Install minimal deps
        run: pip install pytest pyyaml

      - name: Payload parity
        run: python -m pytest tests/test_payload_parity.py -q

      - name: IAM containment (skipped until Phase 2 lands)
        run: |
          if [ -f tests/test_iam_containment.py ]; then
            python -m pytest tests/test_iam_containment.py -q
          else
            echo "tests/test_iam_containment.py not present yet — Phase 2 adds it"
          fi
