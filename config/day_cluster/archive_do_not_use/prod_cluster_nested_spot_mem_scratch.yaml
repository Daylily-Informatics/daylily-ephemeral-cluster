Region: ${REGSUB_REGION}  #us-west-2
Image:
  Os: ubuntu2204
HeadNode:
  InstanceType: ${REGSUB_HEADNODE_INSTANCE_TYPE} #r7i.2xlarge
  Networking:
    ElasticIp: true
    SubnetId: ${REGSUB_PUB_SUBNET}  # subnet-018d25d2f208a83a2
    # ${REGSUB_SLURM_ACCOUNTING_HEADNODE_NETWORKING}
  DisableSimultaneousMultithreading: false
  Dcv:
    Enabled: false
  LocalStorage:
    RootVolume:  # ~$0.05/hr
      Size: 421
      VolumeType: gp3
      DeleteOnTermination: ${REGSUB_DELETE_LOCAL_ROOT}
    EphemeralVolume:
      MountDir: /head_root
  CustomActions:
    OnNodeConfigured:
      Script: ${REGSUB_S3_BUCKET_INIT}/post_install_ubuntu_combined.sh # head and each compute can have different scripts if desired
      Args:
        - ${REGSUB_REGION}
        - ${REGSUB_S3_BUCKET_INIT}
        - ${REGSUB_SPOT_PRICE_WARN_THRESHOLD}
  Iam:
    S3Access: &dayoa_s3_access
      - BucketName: ${REGSUB_S3_REFERENCE_BUCKET}
        EnableWriteAccess: false
      - BucketName: ${REGSUB_S3_CONTROL_DATA_BUCKET}
        EnableWriteAccess: false
      - BucketName: ${REGSUB_S3_STAGE_BUCKET}
        EnableWriteAccess: false
      - BucketName: ${REGSUB_S3_EXPORT_BUCKET}
        EnableWriteAccess: true
    AdditionalIamPolicies:
      - Policy: ${REGSUB_S3_IAM_POLICY} 
      - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
Scheduling:
  Scheduler: slurm
  SlurmSettings:
    EnableMemoryBasedScheduling: false
    CustomSlurmSettings:
    - JobSubmitPlugins: lua
    - AccountingStoreFlags: job_comment
    - PrologFlags: Alloc
    ScaledownIdletime: 5
    Dns:
      DisableManagedDns: false
    QueueUpdateStrategy: DRAIN
    # ${REGSUB_SLURM_ACCOUNTING_DATABASE}

  SlurmQueues:
    # -------------------------------------------------------------------------
    # Tiny/helper queue: only allowed sub-128 queue.
    # -------------------------------------------------------------------------
    - Name: i8
      JobExclusiveAllocation: false
      CapacityType: SPOT
      AllocationStrategy: ${REGSUB_ALLOCATION_STRATEGY}
      ComputeResources:
        - Name: price8
          Instances:
            - InstanceType: r7i.2xlarge
            - InstanceType: r6i.2xlarge
          MinCount: 0
          MaxCount: ${REGSUB_MAX_COUNT_8I}
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 100
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
      Networking:
        SubnetIds:
          - ${REGSUB_PRIVATE_SUBNET}
          # Future cross-AZ mode, leave disabled until FSx/data-path impact is accepted.
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
      CustomActions:
        OnNodeConfigured:
          Script: ${REGSUB_S3_BUCKET_INIT}/post_install_ubuntu_combined.sh
          Args:
            - ${REGSUB_REGION}
            - ${REGSUB_S3_BUCKET_INIT}
            - ${REGSUB_SPOT_PRICE_WARN_THRESHOLD}
      Iam:
        S3Access: *dayoa_s3_access
        AdditionalIamPolicies:
          - Policy: ${REGSUB_S3_IAM_POLICY}
          - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

    # -------------------------------------------------------------------------
    # 128-vCPU EBS/FSx queue.
    # Nested overlapping pools for best Spot pricing while preserving memory gates.
    # -------------------------------------------------------------------------
    - Name: i128
      JobExclusiveAllocation: false
      CapacityType: SPOT
      AllocationStrategy: ${REGSUB_ALLOCATION_STRATEGY}
      ComputeResources:
        - Name: price128
          Instances:
            - InstanceType: c6i.32xlarge
            - InstanceType: c6i.metal
            - InstanceType: m6i.32xlarge
            - InstanceType: m6i.metal
            - InstanceType: r6i.32xlarge
            - InstanceType: r6i.metal
          MinCount: 0
          MaxCount: ${REGSUB_MAX_COUNT_128I}
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 100
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
        - Name: mem128
          Instances:
            - InstanceType: m6i.32xlarge
            - InstanceType: m6i.metal
            - InstanceType: r6i.32xlarge
            - InstanceType: r6i.metal
          MinCount: 0
          MaxCount: ${REGSUB_MAX_COUNT_128I}
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 200
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
        - Name: bigmem128
          Instances:
            - InstanceType: r6i.32xlarge
            - InstanceType: r6i.metal
          MinCount: 0
          MaxCount: ${REGSUB_MAX_COUNT_128I}
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 300
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
      Networking:
        SubnetIds:
          - ${REGSUB_PRIVATE_SUBNET}
          # Future cross-AZ mode, leave disabled until FSx/data-path impact is accepted.
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
      CustomActions:
        OnNodeConfigured:
          Script: ${REGSUB_S3_BUCKET_INIT}/post_install_ubuntu_combined.sh
          Args:
            - ${REGSUB_REGION}
            - ${REGSUB_S3_BUCKET_INIT}
            - ${REGSUB_SPOT_PRICE_WARN_THRESHOLD}
      Iam:
        S3Access: *dayoa_s3_access
        AdditionalIamPolicies:
          - Policy: ${REGSUB_S3_IAM_POLICY}
          - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

    # -------------------------------------------------------------------------
    # 128-vCPU local NVMe queue.
    # /scratch is a hard substrate requirement, so this remains its own partition.
    # -------------------------------------------------------------------------
    - Name: i128nvme
      JobExclusiveAllocation: false
      CapacityType: SPOT
      AllocationStrategy: ${REGSUB_ALLOCATION_STRATEGY}
      ComputeSettings:
        LocalStorage:
          EphemeralVolume:
            MountDir: /scratch
      ComputeResources:
        - Name: price128nvme
          Instances:
            - InstanceType: i4i.32xlarge
          MinCount: 0
          MaxCount: ${REGSUB_MAX_COUNT_128I}
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 100
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
      Networking:
        SubnetIds:
          - ${REGSUB_PRIVATE_SUBNET}
          # Future cross-AZ mode, leave disabled until FSx/data-path impact is accepted.
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
      CustomActions:
        OnNodeConfigured:
          Script: ${REGSUB_S3_BUCKET_INIT}/post_install_ubuntu_combined.sh
          Args:
            - ${REGSUB_REGION}
            - ${REGSUB_S3_BUCKET_INIT}
            - ${REGSUB_SPOT_PRICE_WARN_THRESHOLD}
      Iam:
        S3Access: *dayoa_s3_access
        AdditionalIamPolicies:
          - Policy: ${REGSUB_S3_IAM_POLICY}
          - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

    # -------------------------------------------------------------------------
    # 192-vCPU EBS/FSx queue.
    # Most ordinary jobs should use: sbatch --partition i192 --mem=300G ./run.sh
    # price192 = C + M + R, advertised as low-memory for widest Spot surface.
    # mem192 = M + R, bigmem192 = R only.
    # -------------------------------------------------------------------------
    - Name: i192
      JobExclusiveAllocation: false
      CapacityType: SPOT
      AllocationStrategy: ${REGSUB_ALLOCATION_STRATEGY}
      ComputeResources:
        - Name: price192
          Instances:
            - InstanceType: c7i.48xlarge
            - InstanceType: c7i.metal-48xl
            - InstanceType: c8a.48xlarge
            - InstanceType: c8a.metal-48xl
            - InstanceType: c6a.metal
            - InstanceType: m7i.48xlarge
            - InstanceType: m7i.metal-48xl
            - InstanceType: r7i.48xlarge
            - InstanceType: r7i.metal-48xl
            - InstanceType: r6a.metal
          MinCount: 0
          MaxCount: ${REGSUB_MAX_COUNT_192I}
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 100
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
        - Name: mem192
          Instances:
            - InstanceType: m7i.48xlarge
            - InstanceType: m7i.metal-48xl
            - InstanceType: r7i.48xlarge
            - InstanceType: r7i.metal-48xl
            - InstanceType: r6a.metal
          MinCount: 0
          MaxCount: ${REGSUB_MAX_COUNT_192I}
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 200
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
        - Name: bigmem192
          Instances:
            - InstanceType: r7i.48xlarge
            - InstanceType: r7i.metal-48xl
            - InstanceType: r6a.metal
          MinCount: 0
          MaxCount: ${REGSUB_MAX_COUNT_192I}
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 300
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
      Networking:
        SubnetIds:
          - ${REGSUB_PRIVATE_SUBNET}
          # Future cross-AZ mode, leave disabled until FSx/data-path impact is accepted.
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
      CustomActions:
        OnNodeConfigured:
          Script: ${REGSUB_S3_BUCKET_INIT}/post_install_ubuntu_combined.sh
          Args:
            - ${REGSUB_REGION}
            - ${REGSUB_S3_BUCKET_INIT}
            - ${REGSUB_SPOT_PRICE_WARN_THRESHOLD}
      Iam:
        S3Access: *dayoa_s3_access
        AdditionalIamPolicies:
          - Policy: ${REGSUB_S3_IAM_POLICY}
          - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

    # -------------------------------------------------------------------------
    # 192-vCPU local NVMe queue.
    # Use for BCLConvert/bcl2fq/high-I/O jobs that explicitly stage through /scratch.
    # Nested pools allow bigger-memory Spot if cheaper for low-mem jobs.
    # -------------------------------------------------------------------------
    - Name: i192nvme
      JobExclusiveAllocation: false
      CapacityType: SPOT
      AllocationStrategy: ${REGSUB_ALLOCATION_STRATEGY}
      ComputeSettings:
        LocalStorage:
          EphemeralVolume:
            MountDir: /scratch
      ComputeResources:
        - Name: price192nvme
          Instances:
            - InstanceType: c8id.48xlarge
            - InstanceType: c8id.metal-48xl
            - InstanceType: m8id.48xlarge
            - InstanceType: m8id.metal-48xl
            - InstanceType: r8id.48xlarge
            - InstanceType: r8id.metal-48xl
          MinCount: 0
          MaxCount: ${REGSUB_MAX_COUNT_192I}
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 100
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
        - Name: mem192nvme
          Instances:
            - InstanceType: m8id.48xlarge
            - InstanceType: m8id.metal-48xl
            - InstanceType: r8id.48xlarge
            - InstanceType: r8id.metal-48xl
          MinCount: 0
          MaxCount: ${REGSUB_MAX_COUNT_192I}
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 200
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
        - Name: bigmem192nvme
          Instances:
            - InstanceType: r8id.48xlarge
            - InstanceType: r8id.metal-48xl
          MinCount: 0
          MaxCount: ${REGSUB_MAX_COUNT_192I}
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 300
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
      Networking:
        SubnetIds:
          - ${REGSUB_PRIVATE_SUBNET}
          # Future cross-AZ mode, leave disabled until FSx/data-path impact is accepted.
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
      CustomActions:
        OnNodeConfigured:
          Script: ${REGSUB_S3_BUCKET_INIT}/post_install_ubuntu_combined.sh
          Args:
            - ${REGSUB_REGION}
            - ${REGSUB_S3_BUCKET_INIT}
            - ${REGSUB_SPOT_PRICE_WARN_THRESHOLD}
      Iam:
        S3Access: *dayoa_s3_access
        AdditionalIamPolicies:
          - Policy: ${REGSUB_S3_IAM_POLICY}
          - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

    # -------------------------------------------------------------------------
    # 384-vCPU local NVMe queue.
    # Same nested model at 384 vCPU.
    # -------------------------------------------------------------------------
    - Name: i384nvme
      JobExclusiveAllocation: false
      CapacityType: SPOT
      AllocationStrategy: ${REGSUB_ALLOCATION_STRATEGY}
      ComputeSettings:
        LocalStorage:
          EphemeralVolume:
            MountDir: /scratch
      ComputeResources:
        - Name: price384nvme
          Instances:
            - InstanceType: c8id.96xlarge
            - InstanceType: c8id.metal-96xl
            - InstanceType: m8id.96xlarge
            - InstanceType: m8id.metal-96xl
            - InstanceType: r8id.96xlarge
            - InstanceType: r8id.metal-96xl
          MinCount: 0
          MaxCount: ${REGSUB_MAX_COUNT_192I}
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 100
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
        - Name: mem384nvme
          Instances:
            - InstanceType: m8id.96xlarge
            - InstanceType: m8id.metal-96xl
            - InstanceType: r8id.96xlarge
            - InstanceType: r8id.metal-96xl
          MinCount: 0
          MaxCount: ${REGSUB_MAX_COUNT_192I}
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 200
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
        - Name: bigmem384nvme
          Instances:
            - InstanceType: r8id.96xlarge
            - InstanceType: r8id.metal-96xl
          MinCount: 0
          MaxCount: ${REGSUB_MAX_COUNT_192I}
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 300
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
      Networking:
        SubnetIds:
          - ${REGSUB_PRIVATE_SUBNET}
          # Future cross-AZ mode, leave disabled until FSx/data-path impact is accepted.
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
      CustomActions:
        OnNodeConfigured:
          Script: ${REGSUB_S3_BUCKET_INIT}/post_install_ubuntu_combined.sh
          Args:
            - ${REGSUB_REGION}
            - ${REGSUB_S3_BUCKET_INIT}
            - ${REGSUB_SPOT_PRICE_WARN_THRESHOLD}
      Iam:
        S3Access: *dayoa_s3_access
        AdditionalIamPolicies:
          - Policy: ${REGSUB_S3_IAM_POLICY}
          - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

    # -------------------------------------------------------------------------
    # 192-vCPU huge local NVMe queue.
    # Keep separate because huge scratch is a hard routing requirement.
    # -------------------------------------------------------------------------
    - Name: i192hugenvme
      JobExclusiveAllocation: false
      CapacityType: SPOT
      AllocationStrategy: ${REGSUB_ALLOCATION_STRATEGY}
      ComputeSettings:
        LocalStorage:
          EphemeralVolume:
            MountDir: /scratch
      ComputeResources:
        - Name: price192hugenvme
          Instances:
            - InstanceType: i7i.48xlarge
            - InstanceType: i7i.metal-48xl
            - InstanceType: i7ie.48xlarge
            - InstanceType: i7ie.metal-48xl
          MinCount: 0
          MaxCount: ${REGSUB_MAX_COUNT_192I}
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 100
          # Both i7i/i7ie 48xl classes are 1536 GiB-class.
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
      Networking:
        SubnetIds:
          - ${REGSUB_PRIVATE_SUBNET}
          # Future cross-AZ mode, leave disabled until FSx/data-path impact is accepted.
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
          # - ${REGSUB_PRIVATE_SUBNET}
      CustomActions:
        OnNodeConfigured:
          Script: ${REGSUB_S3_BUCKET_INIT}/post_install_ubuntu_combined.sh
          Args:
            - ${REGSUB_REGION}
            - ${REGSUB_S3_BUCKET_INIT}
            - ${REGSUB_SPOT_PRICE_WARN_THRESHOLD}
      Iam:
        S3Access: *dayoa_s3_access
        AdditionalIamPolicies:
          - Policy: ${REGSUB_S3_IAM_POLICY}
          - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
Monitoring:
  DetailedMonitoring: ${REGSUB_DETAILED_MONITORING}  
  Logs:
    CloudWatch:
      Enabled: true
      RetentionInDays: 3  # must be 0,1,3,5,7,14,30,60,90...
SharedStorage:  # This is the local FS which should not be kept idle for long
  - MountDir: /fsx  # The cost of this will be roughly $22.93 per day for 4.2Tb, spin down when not in use
    Name: fsx-${REGSUB_CLUSTER_NAME}   # WARNING, EDIT NAME WILL DEL EXISTING DATA
    StorageType: FsxLustre        
    FsxLustreSettings:
      StorageCapacity: ${REGSUB_FSX_SIZE}  #  4.2TB ~  $22.93/day or $0.921/hr
      DeploymentType: SCRATCH_2
      DeletionPolicy: ${REGSUB_SAVE_FSX}  # Set to true to keep the FSX after the cluster is deleted
      DataRepositoryAssociations:
        - Name: reference-data
          FileSystemPath: /references/
          DataRepositoryPath: ${REGSUB_S3_REFERENCE_URI}/
          BatchImportMetaDataOnCreate: true
          AutoImportPolicy: [NEW, CHANGED, DELETED]
Tags:  # TAGs necessary for per-user/project/job cost tracking
  - Key: aws-parallelcluster-username
    Value: ${REGSUB_USERNAME}
  - Key: aws-parallelcluster-jobid
    Value: ${REGSUB_AWS_ACCOUNT_ID}
  - Key: aws-parallelcluster-project
    Value: ${REGSUB_PROJECT}
  - Key: aws-parallelcluster-clustername
    Value: ${REGSUB_CLUSTER_NAME}
  - Key: aws-parallelcluster-enforce-budget
    Value: ${REGSUB_ENFORCE_BUDGET}
  - Key: aws-parallelcluster-daylily-git-deets
    Value: ${REGSUB_DAYLILY_GIT_DEETS}
  - Key: aws-parallelcluster-monitor-bucket
    Value: ${REGSUB_S3_BUCKET_INIT}
DevSettings:
  Timeouts:
    HeadNodeBootstrapTimeout: 3600
    ComputeNodeBootstrapTimeout: 3600
