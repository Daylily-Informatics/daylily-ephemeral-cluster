Region: ${REGSUB_REGION}
Image:
  Os: rhel8
HeadNode:
  InstanceType: ${REGSUB_HEADNODE_INSTANCE_TYPE}
  Networking:
    ElasticIp: true
    SubnetId: ${REGSUB_PUB_SUBNET}
    # ${REGSUB_SLURM_ACCOUNTING_HEADNODE_NETWORKING}
  DisableSimultaneousMultithreading: false
  Dcv:
    Enabled: false
  LocalStorage:
    RootVolume:
      Size: 421
      VolumeType: gp3
      DeleteOnTermination: ${REGSUB_DELETE_LOCAL_ROOT}
    EphemeralVolume:
      MountDir: /head_root
  Iam:
    S3Access:
    - BucketName: ${REGSUB_S3_REFERENCE_BUCKET}
      EnableWriteAccess: false
    - BucketName: ${REGSUB_S3_CONTROL_DATA_BUCKET}
      EnableWriteAccess: false
    - BucketName: ${REGSUB_S3_STAGE_BUCKET}
      EnableWriteAccess: false
    - BucketName: ${REGSUB_S3_EXPORT_BUCKET}
      EnableWriteAccess: true
    AdditionalIamPolicies:
    - Policy: ${REGSUB_S3_IAM_POLICY}
    - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
Scheduling:
  Scheduler: slurm
  SlurmSettings:
    EnableMemoryBasedScheduling: true
    ScaledownIdletime: 5
    Dns:
      DisableManagedDns: false
    QueueUpdateStrategy: DRAIN
    # ${REGSUB_SLURM_ACCOUNTING_DATABASE}
  SlurmQueues:
  - Name: dragen
    CapacityType: SPOT
    AllocationStrategy: ${REGSUB_ALLOCATION_STRATEGY}
    JobExclusiveAllocation: false
    ComputeSettings:
      LocalStorage:
        EphemeralVolume:
          MountDir: /scratch
    Image:
      CustomAmi: ami-044bef021cb86a54c
    ComputeResources:
    - Name: f26xlarge
      Instances:
      - InstanceType: f2.6xlarge
      MinCount: 0
      MaxCount: 2
      DynamicNodePriority: 100
      SchedulableMemory: 249036
      Networking:
        PlacementGroup:
          Enabled: false
      Efa:
        Enabled: false
    Networking:
      SubnetIds:
      - ${REGSUB_PRIVATE_SUBNET}
    Iam:
      S3Access:
      - BucketName: ${REGSUB_S3_REFERENCE_BUCKET}
        EnableWriteAccess: false
      - BucketName: ${REGSUB_S3_CONTROL_DATA_BUCKET}
        EnableWriteAccess: false
      - BucketName: ${REGSUB_S3_STAGE_BUCKET}
        EnableWriteAccess: false
      - BucketName: ${REGSUB_S3_EXPORT_BUCKET}
        EnableWriteAccess: true
      AdditionalIamPolicies:
      - Policy: ${REGSUB_S3_IAM_POLICY}
      - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
Monitoring:
  DetailedMonitoring: ${REGSUB_DETAILED_MONITORING}
  Logs:
    CloudWatch:
      Enabled: true
      RetentionInDays: 3
Tags:
- Key: aws-parallelcluster-username
  Value: "${REGSUB_USERNAME}"
- Key: aws-parallelcluster-jobid
  Value: "${REGSUB_AWS_ACCOUNT_ID}"
- Key: aws-parallelcluster-project
  Value: "${REGSUB_PROJECT}"
- Key: aws-parallelcluster-clustername
  Value: "${REGSUB_CLUSTER_NAME}"
- Key: aws-parallelcluster-enforce-budget
  Value: ${REGSUB_ENFORCE_BUDGET}
- Key: aws-parallelcluster-daylily-git-deets
  Value: "${REGSUB_DAYLILY_GIT_DEETS}"
- Key: aws-parallelcluster-monitor-bucket
  Value: "${REGSUB_S3_BUCKET_INIT}"
DevSettings:
  Timeouts:
    HeadNodeBootstrapTimeout: 3600
    ComputeNodeBootstrapTimeout: 3600
