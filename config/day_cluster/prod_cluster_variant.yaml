Region: ${REGSUB_REGION}  #us-west-2
Image:
  Os: ubuntu2204
HeadNode:
  InstanceType: r7i.2xlarge
  Networking:
    ElasticIp: true
    SubnetId: ${REGSUB_PUB_SUBNET}  # subnet-018d25d2f208a83a2
    # ${REGSUB_SLURM_ACCOUNTING_HEADNODE_NETWORKING}
  DisableSimultaneousMultithreading: false
  Dcv:
    Enabled: false
  LocalStorage:
    RootVolume:
      Size: 421
      VolumeType: gp3
      DeleteOnTermination: ${REGSUB_DELETE_LOCAL_ROOT}
    EphemeralVolume:
      MountDir: /head_root
  CustomActions:
    OnNodeConfigured:
      Script: ${REGSUB_S3_BUCKET_INIT}/post_install_ubuntu_combined.sh # head and each compute can have different scripts if desired
      Args:
        - ${REGSUB_REGION}
        - ${REGSUB_S3_BUCKET_INIT}
  Iam:
    S3Access: &dayoa_s3_access
      - BucketName: ${REGSUB_S3_REFERENCE_BUCKET}
        EnableWriteAccess: false
      - BucketName: ${REGSUB_S3_CONTROL_DATA_BUCKET}
        EnableWriteAccess: false
      - BucketName: ${REGSUB_S3_STAGE_BUCKET}
        EnableWriteAccess: false
      - BucketName: ${REGSUB_S3_EXPORT_BUCKET}
        EnableWriteAccess: true
    AdditionalIamPolicies:
      - Policy: ${REGSUB_S3_IAM_POLICY}
      - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
Scheduling:
  Scheduler: slurm
  SlurmSettings:
    EnableMemoryBasedScheduling: false
    ScaledownIdletime: 5
    Dns:
      DisableManagedDns: false
    QueueUpdateStrategy: DRAIN
    # ${REGSUB_SLURM_ACCOUNTING_DATABASE}
  SlurmQueues:
    - Name: i8
      CapacityType: SPOT
      AllocationStrategy: ${REGSUB_ALLOCATION_STRATEGY}
      ComputeResources:
        - Name: r7gb64
          Instances:
          - InstanceType: r7i.2xlarge
          MinCount: 0
          MaxCount: 2
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
        - Name: r6gb64
          Instances:
          - InstanceType: r6i.2xlarge
          MinCount: 0
          MaxCount: 2
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
      Networking:
        SubnetIds:
          - ${REGSUB_PRIVATE_SUBNET}
      CustomActions:
        OnNodeConfigured:
          Script: ${REGSUB_S3_BUCKET_INIT}/post_install_ubuntu_combined.sh
          Args:
            - ${REGSUB_REGION}
            - ${REGSUB_S3_BUCKET_INIT}
      Iam:
        S3Access: *dayoa_s3_access
        AdditionalIamPolicies:
          - Policy: ${REGSUB_S3_IAM_POLICY}
          - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
    - Name: i128
