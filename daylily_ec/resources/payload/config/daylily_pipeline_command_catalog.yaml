        compatible_platforms:
          - ILMN
        compatible_cluster_types:
          - daywgs
        compatible_data_modes:
          - ilmn_solo
        git_tag: 10.0.97
        no_containerized: false
        artifact_registration: &dayoa_multiqc_artifact_registration
          enabled: true
          manifest_source: dayoa_manifest
          evidence_manifest_path: results/day/{genome}/reports/dayoa_evidence_manifest.json
          include_classifications:
