            - results/day/{genome}/**/*.csi
          require_existing: true
          parser_family_hint: multiqc
          multiqc_report_kind: final
          multiqc_version: "1.35"
          multiqc_reports:
            - report_kind: final
              html_path: results/day/{genome}/reports/DAY_final_multiqc.html
              data_dir_path: results/day/{genome}/reports/DAY_final_multiqc_data/
          identity:
            analysis_euid: "{analysis_id}"
            run_euid: "{analysis_id}"
        validation_runs:
