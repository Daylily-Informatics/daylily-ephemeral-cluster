---
command_catalog_version: 2
default_repository: daylily-omics-analysis
# day-clone consumes the repository rows below directly:
#   day-clone --repository <repo-key> --destination <analysis-id> --git-tag <ref>
#   day-clone -d <analysis-id> -t <ref>
# If --repository is omitted, day-clone uses default_repository. If --git-tag/-t
# is omitted, it uses the selected repository's default_ref. The checkout path
# below /fsx/analysis_results/<executing_entity>/<analysis_id>/ is relative_path.
input_contracts:
  sample_manifest:
    description: "DayEC stages analysis_samples.tsv into DayOA config/samples.tsv and config/units.tsv."
    source_table:
      path: analysis_samples.tsv
      required_columns:
        - RUN_ID
        - SAMPLE_ID
        - EXPERIMENTID
        - SAMPLE_TYPE
        - LIB_PREP
        - SEQ_VENDOR
        - SEQ_PLATFORM
        - LANE
        - SEQBC_ID
    generated_tables:
      samples_tsv:
        path: config/samples.tsv
        required_columns:
          - SAMPLEID
          - SAMPLESOURCE
          - SAMPLECLASS
          - BIOLOGICAL_SEX
          - CONCORDANCE_CONTROL_PATH
          - IS_POSITIVE_CONTROL
          - IS_NEGATIVE_CONTROL
          - SAMPLE_TYPE
          - TUM_NRM_SAMPLEID_MATCH
          - EXTERNAL_SAMPLE_ID
          - N_X
          - N_Y
          - TRUTH_DATA_DIR
      units_tsv:
        path: config/units.tsv
        required_columns:
          - RUNID
          - SAMPLEID
          - EXPERIMENTID
          - LANEID
          - BARCODEID
          - LIBPREP
          - SEQ_VENDOR
          - SEQ_PLATFORM
          - ILMN_R1_PATH
          - ILMN_R2_PATH
          - PACBIO_R1_PATH
          - PACBIO_R2_PATH
          - ONT_R1_PATH
          - ONT_R2_PATH
          - UG_R1_PATH
          - UG_R2_PATH
          - SUBSAMPLE_PCT
          - ILMN_TRIM_READ_LENGTH
          - SAMPLEUSE
          - BWA_KMER
          - DEEP_MODEL
          - ULTIMA_CRAM
          - ULTIMA_CRAM_ALIGNER
          - ULTIMA_CRAM_SNV_CALLER
          - ONT_CRAM
          - ONT_CRAM_ALIGNER
          - ONT_CRAM_SNV_CALLER
          - PB_BAM
          - PB_BAM_ALIGNER
          - PB_BAM_SNV_CALLER
          - ROCHE_BAM
          - ROCHE_BAM_ALIGNER
          - ROCHE_BAM_SNV_CALLER
          - ROCHE_DOWNSAMPLE_RATIO
          - LONGREADTRIM_READ_LENGTH
          - LONGREADTRIM_MODE
          - ULTIMA_SUBSAMPLE_PCT
          - ONT_SUBSAMPLE_PCT
          - ONT_BAM
          - ONT_BAM_ALIGNER
          - ONT_BAM_SNV_CALLER
  run_context:
    description: "DayOA run-analysis commands consume config/runs.tsv rows for mounted or S3 run directories."
    source_table:
      path: config/runs.tsv
      required_columns:
        - RUNID
        - PLATFORM
        - RUN_DIR
        - SOURCE_S3_URI
        - MOUNT_ID
        - SAMPLE_SHEET
        - BASECALLING_STATE
        - RUN_STATUS
        - OUTPUT_ROOT
        - REGION
        - PROFILE
test_data_locations:
  - location_id: default_reference_reads_slim
    description: "Catalog validation sample read fixtures live under the default /fsx/data path; sample manifests should use pass-through or mounted-readonly paths here instead of creating per-command staging DRAs."
    mount_path: /fsx/data
    data_root: /fsx/data/genomic_data/organism_reads_slim
    s3_uri: s3://lsmc-dayoa-references-usw2/genomic_data/organism_reads_slim/
    applies_to_command_classes:
      - sample_analysis
  - location_id: default_control_reads_slim
    description: "Catalog validation control/read fixtures that are not in the reference bucket live in the default control-data mount; do not stage these inputs unless a row explicitly requires copied data."
    mount_path: /fsx/control_data
    data_root: /fsx/control_data/genomic_data/organism_reads_slim
    s3_uri: s3://lsmc-dayoa-control-data-usw2/genomic_data/organism_reads_slim/
    applies_to_command_classes:
      - sample_analysis
  - location_id: default_control_run_data
    description: "Catalog validation run-directory fixtures live under the default control-data mount when copied out of raw sequencing storage for repeatable run-QC and demux tests."
    mount_path: /fsx/control_data
    data_root: /fsx/control_data/run_data
    s3_uri: s3://lsmc-dayoa-control-data-usw2/run_data/
    applies_to_command_classes:
      - run_analysis
test_data_profiles:
  none:
    description: "Utility commands that do not consume sample, run, or mounted source data."
    source_mount_mode: none
    locations: []
    source_notes:
      - "Use for shell/bootstrap smoke tests such as simple-test."
  default_reads_slim:
    description: "Slim catalog validation reads available from the default /fsx/data and control-data mounts."
    source_mount_mode: default_mounted
    source_s3_uri_template: s3://lsmc-dayoa-references-usw2/genomic_data/organism_reads_slim/
    source_fsx_prefix: /fsx/data/genomic_data/organism_reads_slim/
    locations:
      - default_reference_reads_slim
      - default_control_reads_slim
    source_notes:
      - "Prefer /fsx/data/genomic_data/organism_reads_slim for GIAB ILMN, ONT, Ultima, PacBio, Roche, hybrid, and concordance sample-analysis rows."
      - "Use /fsx/control_data/genomic_data/organism_reads_slim only for control fixtures that are not present in the reference mount."
  illumina_run_directory:
    description: "Illumina run-directory validation profile for run QC and BCL Convert rows."
    source_mount_mode: run_dra_required
    source_s3_uri_template: s3://lsmc-ssf-sequencing-data/basecalls/lsmc/ssf-hq/LH01106/2026/20260514_LH01106_0009_B23TVLGLT4/
    source_fsx_prefix: /fsx/run_dir_mounts/{MOUNT_ID}/
    run_context_source_s3_column: SOURCE_S3_URI
    run_context_mount_id_column: MOUNT_ID
    locations:
      - default_control_run_data
    source_notes:
      - "Expected repeated-test location is /fsx/control_data/run_data/illumina when present."
      - "Historical live-validation source was s3://lsmc-ssf-sequencing-data/basecalls/lsmc/ssf-hq/LH01106/2026/20260514_LH01106_0009_B23TVLGLT4/ mounted read-only under /fsx/run_dir_mounts/20260514_LH01106_0009_B23TVLGLT4/."
  bclconvert_0_mm:
    description: "Illumina BCL Convert validation profile using lane-specific sample-sheet preparation with zero barcode mismatches."
    source_mount_mode: run_dra_required
    source_s3_uri_template: s3://lsmc-ssf-sequencing-data/basecalls/lsmc/ssf-hq/LH01106/2026/20260514_LH01106_0009_B23TVLGLT4/
    source_fsx_prefix: /fsx/run_dir_mounts/{MOUNT_ID}/
    run_context_source_s3_column: SOURCE_S3_URI
    run_context_mount_id_column: MOUNT_ID
    run_context_values:
      METRICS_PATH: .test_data/data/ultima_run_qc/ultima_demux_summary_mqc.tsv
    locations:
      - default_control_run_data
    source_notes:
      - "Use the same mounted run-directory source as illumina_run_directory and the DayOA bclconvert_0_mm clone/config for zero-mismatch sample-sheet injection."
      - "Do not copy the BCL run directory into /fsx/analysis_results; DayOA should read the read-only mount through the run-dir link."
  ont_run_directory:
    description: "ONT run-directory validation profile for demux-complete run QC."
    source_mount_mode: run_dra_required
    source_s3_uri_template: s3://lsmc-ssf-sequencing-data/basecalls/lsmc/ssf-hq/pca100/2026/20260513_ONT_HG003/
    source_fsx_prefix: /fsx/run_dir_mounts/{MOUNT_ID}/
    run_context_source_s3_column: SOURCE_S3_URI
    run_context_mount_id_column: MOUNT_ID
    locations:
      - default_control_run_data
    source_notes:
      - "Expected repeated-test location is /fsx/control_data/run_data/ont when present."
      - "Historical live-validation source was s3://lsmc-ssf-sequencing-data/basecalls/lsmc/ssf-hq/pca100/2026/20260513_ONT_HG003/ mounted read-only under /fsx/run_dir_mounts/20260513_ONT_HG003/."
  ultima_run_directory:
    description: "Ultima run-directory validation profile for demux-complete run QC."
    source_mount_mode: run_dra_required
    source_s3_uri_template: s3://lsmc-ssf-sequencing-data/basecalls/lsmc/ssf-hq/RUN602221/2026/602221-20260417_2346/
    source_fsx_prefix: /fsx/run_dir_mounts/{MOUNT_ID}/
    run_context_source_s3_column: SOURCE_S3_URI
    run_context_mount_id_column: MOUNT_ID
    run_context_values:
      METRICS_PATH: .test_data/data/ultima_run_qc/ultima_demux_summary_mqc.tsv
    locations:
      - default_control_run_data
    source_notes:
      - "Expected repeated-test location is /fsx/control_data/run_data/ultima when present."
      - "Historical live-validation source was s3://lsmc-ssf-sequencing-data/basecalls/lsmc/ssf-hq/RUN602221/2026/602221-20260417_2346/ mounted read-only under /fsx/run_dir_mounts/602221-20260417_2346/."
repositories:
  daylily-omics-analysis:
    display_name: "Daylily Omics Analysis"
    description: "Primary whole genome and multiomics workflows."
    clone_transport: ssh
    auth_mode: aws_deploy_key
    https_url: https://github.com/lsmc-bio/daylily-omics-analysis.git
    ssh_url: git@github.com:lsmc-bio/daylily-omics-analysis.git
    default_ref: 11.0.15
    relative_path: daylily-omics-analysis
    analysis_commands:
      - command_id: simple-test
        type: test
        validated_version: 10.0.97
        test_data_profile: none
        display_name: "Simple Test"
        description: "Smoke-test DayOA shell initialization and local help target without staged sample inputs."
        datasource: DayOA
        launcher: workflow_launch
        command_class: utility
        input_contract: none
        requires_staging: false
        requires_run_mount: false
        runtime_parameters: {}
        input_requirements: {}
        targets:
          - help
        genome: hg38
        jobs: 1
        aligners: []
        dedupers: []
        snv_callers: []
        sv_callers: []
        dy_command: "source dyoainit; dy-a local hg38; dy-r -p -k -j 1 help"
        dryrun_dy_command: "source dyoainit; dy-a local hg38; dy-r -p -k -j 1 help"
        compatible_platforms:
          - local
        compatible_cluster_types:
          - daywgs
        compatible_data_modes:
          - none
        git_tag: 10.0.97
        no_containerized: true
        validation_runs: []
      - command_id: illumina_snv_alignstats
        type: prod
        validated_version: 10.0.97
        test_data_profile: default_reads_slim
        display_name: "Illumina SNV + Alignstats"
        description: "Illumina WGS Sentieon DNAscope and alignment-statistics launch profile."
        datasource: Illumina
        launcher: workflow_launch
        command_class: sample_analysis
        input_contract: sample_manifest
        requires_staging: true
        requires_run_mount: false
        runtime_parameters: {}
        input_requirements:
          required_source_columns:
            - ILMN_R1_FQ
            - ILMN_R2_FQ
        targets:
          - produce_sent_align
          - produce_dmd_dedup_cram
          - produce_sentd_snv_vcf
          - produce_snv_concordances
          - produce_alignstats
        genome: hg38
        jobs: 20
        aligners:
          - sent
        dedupers:
          - dmd
        snv_callers:
          - sentd
        sv_callers: []
        dy_command: "bin/day_run produce_sent_align produce_dmd_dedup_cram produce_sentd_snv_vcf produce_snv_concordances produce_alignstats -p -k -j 20"
        dryrun_dy_command: "bin/day_run produce_sent_align produce_dmd_dedup_cram produce_sentd_snv_vcf produce_snv_concordances produce_alignstats -p -k -j 20 -n"
        compatible_platforms:
          - ILMN
        compatible_cluster_types:
          - daywgs
        compatible_data_modes:
          - ilmn_solo
        git_tag: 10.0.97
        no_containerized: false
        validation_runs:
          - run_id: tstver411b_dayoa_catalog_recipe_validation
            generated_at: "2026-05-25T20:04:39Z"
            report_path: docs/tstver411b_command_catalog_test_results.md
            ledger_path: docs/plans/20260525T063158Z_tstver411b_dayoa_catalog_recipe_validation_ledger.md
            cluster: tstVer4-1-1b
            region: us-west-2
            region_az: us-west-2d
            dayec_tag: 4.1.3
            dayec_commit: 012a3b5b30d2e69a07aa80dd4c224ad1ee26d3a4
            dayoa_tag: 1.0.21
            dayoa_commit: c2ffe93f246ff19c346f0a99e04fddc9e2712ff3
            tested_command: "bin/day_run produce_sent_align produce_dmd_dedup_cram produce_sentd_snv_vcf produce_snv_concordances produce_alignstats -p -k -j 20"
            status: success
            dryrun_status: success
            live_status: success
            dryrun_analysis_id: tvb_illumina_snv_alignstats_5x_1021_dryrun
            live_analysis_id: tvb_illumina_snv_alignstats_5x_1021
            stage_or_context: /fsx/staging/staged_external_sequencing_data/remote_stage_20260525T071517Z
            notes: "Live run completed with CRAM, VCF, alignstats, and concordance outputs."
      - command_id: illumina_snv_alignstats_relatedness_vep_multiqc
        type: prod
        validated_version: 10.0.97
        test_data_profile: default_reads_slim
        display_name: "Illumina SNV + Alignstats + Relatedness + VEP MultiQC"
        description: "Illumina WGS Sentieon DNAscope, alignment statistics, relatedness, VEP annotation, and final MultiQC launch profile."
        datasource: Illumina
        launcher: workflow_launch
        command_class: sample_analysis
        input_contract: sample_manifest
        requires_staging: true
        requires_run_mount: false
        runtime_parameters: {}
        input_requirements:
          required_source_columns:
            - ILMN_R1_FQ
            - ILMN_R2_FQ
