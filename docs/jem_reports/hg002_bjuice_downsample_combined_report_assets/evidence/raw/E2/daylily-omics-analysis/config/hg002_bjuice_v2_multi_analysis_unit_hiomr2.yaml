# HG002 Bjuice v2 full-preval multi-analysis-unit HIOMR2 overlay.
#
# The supplied six-manifest set must declare seven HG002 analysis units, each
# with its own SR SUBSAMPLE_PCT and ONT_FQ_START_HOUR/ONT_FQ_END_HOUR interval.
# Global use_fq_data_starting_hrs/use_fq_data_up_to_hrs are intentionally absent:
# mixing either global key with this explicit per-analysis-unit mode fails.
ont_fastq_hour_window_mode: per_analysis_unit

sentdhiomr2:
  hg38_sentdhiomr2_chrms: "1-25"
  lr_input_mode_by_sample:
    HG002: fastq
  provenance_run_id: bjuice_v2_hg002_multi_analysis_unit_hiomr2
  retain_stage_artifacts: true

# The literal catalog target is the slim kitchen-sink mega closure.  It owns
# per-AU Truvari, consensus, CNV, and analytical Inflection inputs; enabling
# the unrelated six-caller NICU lane would route MultiQC through the legacy
# global diagnostic fallback instead.
sentdhiomr2_nicu_research:
  enabled: false
  fastq_recoverability_enabled: false

sentdhiomr2_slim_consensus:
  enabled: true

sentdhiomr2_jasmine:
  enabled: false

truvari_sv_benchmark:
  enabled: true
  env_yaml: ../envs/truvari_v0.2.yaml
  threads: 32
  mem_mb: 64000
  partition: i128nvme,i192nvme,i192hugenvme,i384nvme
  extra_args: >-
    --passonly --sizemin 50 --sizefilt 50 --sizemax -1
    --refdist 500 --pctsize 0.7 --pctseq 0.7 --pctovl 0
    --pick single
  truthsets:
    HG002:
      alt_id: HG002
      regions:
        giab_sv_v5_0q_hc:
          truth_vcf: /fsx/references/genomic_data/organism_annotations/H_sapiens/hg38/controls/giab/sv/v5.0q/HG002/giabHCv5q/HG002_GRCh38_v5.0q_stvar.vcf.gz
          truth_tbi: /fsx/references/genomic_data/organism_annotations/H_sapiens/hg38/controls/giab/sv/v5.0q/HG002/giabHCv5q/HG002_GRCh38_v5.0q_stvar.vcf.gz.tbi
          truth_bed: /fsx/references/genomic_data/organism_annotations/H_sapiens/hg38/controls/giab/sv/v5.0q/HG002/giabHCv5q/HG002_GRCh38_v5.0q_stvar.benchmark.bed
