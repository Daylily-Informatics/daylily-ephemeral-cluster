          Args:
            - us-west-2
            - s3://dayec-validation-bootstrap
      Iam:
        S3Access: *dayoa_s3_access
        AdditionalIamPolicies:
          - Policy: arn:aws:iam::000000000000:policy/dayec-validation-placeholder
          - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
