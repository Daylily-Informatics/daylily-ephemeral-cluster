Region: us-west-2  #us-west-2
Image:
  Os: ubuntu2204
HeadNode:
  InstanceType: r7i.2xlarge #r7i.2xlarge
  Networking:
    ElasticIp: true
    SubnetId: subnet-00000000000000000  # subnet-018d25d2f208a83a2
    # 
  DisableSimultaneousMultithreading: false
  Dcv:
    Enabled: false
  LocalStorage:
    RootVolume:  # ~$0.05/hr
      Size: 421
      VolumeType: gp3
      DeleteOnTermination: true
    EphemeralVolume:
      MountDir: /head_root
  CustomActions:
    OnNodeConfigured:
      Script: s3://dayec-validation-bootstrap/post_install_ubuntu_combined.sh # head and each compute can have different scripts if desired
      Args:
        - us-west-2
        - s3://dayec-validation-bootstrap
  Iam:
    S3Access: &dayoa_s3_access
      - BucketName: dayec-validation-reference
        EnableWriteAccess: false
      - BucketName: dayec-validation-control
        EnableWriteAccess: false
      - BucketName: dayec-validation-stage
        EnableWriteAccess: false
      - BucketName: dayec-validation-export
        EnableWriteAccess: true
    AdditionalIamPolicies:
      - Policy: arn:aws:iam::000000000000:policy/dayec-validation-placeholder 
      - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
Scheduling:
  Scheduler: slurm
  SlurmSettings:
    EnableMemoryBasedScheduling: true 
    ScaledownIdletime: 5
    Dns:
      DisableManagedDns: false
    QueueUpdateStrategy: DRAIN
    # 
  SlurmQueues:
    - Name: i8
      CapacityType: SPOT
      AllocationStrategy: price-capacity-optimized
      ComputeResources:
        - Name: r7gb64
          Instances:
            - InstanceType: r7i.2xlarge
          MinCount: 0
          MaxCount: 1
          SpotPrice: CALCULATE_MAX_SPOT_PRICE
          DynamicNodePriority: 100
          Networking:
            PlacementGroup:
              Enabled: false
          Efa:
            Enabled: false
        - Name: r6gb64
          Instances:
            - InstanceType: r6i.2xlarge
