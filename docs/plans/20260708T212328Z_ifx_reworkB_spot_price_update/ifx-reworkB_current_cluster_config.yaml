---
Region: us-west-2
Image:
  Os: ubuntu2204
HeadNode:
  InstanceType: r7i.8xlarge
  Networking:
    ElasticIp: true
    SubnetId: subnet-0e9acb65aba5a0330
    # 
  DisableSimultaneousMultithreading: false
  Dcv:
    Enabled: false
  LocalStorage:
    RootVolume:
      Size: 421
      VolumeType: gp3
      DeleteOnTermination: true
    EphemeralVolume:
      MountDir: /head_root
  CustomActions:
    OnNodeConfigured:
      Script: 
        s3://lsmc-dayoa-references-usw2/runtime_assets/cluster_boot_config/post_install_ubuntu_combined.sh
      Args:
      - us-west-2
      - s3://lsmc-dayoa-references-usw2/runtime_assets/cluster_boot_config
      - "6.00"
  Iam:
    S3Access:
    - BucketName: lsmc-dayoa-references-usw2
      EnableWriteAccess: false
    - BucketName: lsmc-dayoa-control-data-usw2
      EnableWriteAccess: false
    - BucketName: lsmc-ssf-sequencing-data
      EnableWriteAccess: false
    - BucketName: lsmc-ssf-sequencing-data
      EnableWriteAccess: true
    AdditionalIamPolicies:
    - Policy: arn:aws:iam::108782052779:policy/pclusterTagsAndBudget
    - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
Scheduling:
  Scheduler: slurm
  SlurmSettings:
