# HG002 BJuice verified 5x ILMN plus 5x ONT analytical test overlay.
#
# This carries the immutable DayOA 13.4.11 fixture configuration and narrows
# the active Sentieon HIOMR2 Hybrid CLI scope to chromosome 5.  It does not
# alter the verified FASTQ identities or enable ONT time chunking.
sentdhiomr2:
  hg38_sentdhiomr2_chrms: "5"
  lr_input_mode_by_sample:
    HG002: fastq
  provenance_run_id: init_test_chr5_hg002_5x5x_13411_20260810
  retain_stage_artifacts: true

sentdhiomr2_nicu_research:
  enabled: true

truvari_sv_benchmark:
  enabled: true
  env_yaml: ../envs/truvari_v0.2.yaml
  threads: 32
  mem_mb: 64000
  partition: i128nvme,i192nvme,i192hugenvme,i384nvme
  extra_args: >-
    --passonly --sizemin 50 --sizefilt 50 --sizemax -1
    --refdist 500 --pctsize 0.7 --pctseq 0.7 --pctovl 0
    --pick single
  truthsets:
    HG002:
      alt_id: HG002
      regions:
        giab_sv_v5_0q_hc:
          truth_vcf: /fsx/references/genomic_data/organism_annotations/H_sapiens/hg38/controls/giab/sv/v5.0q/HG002/giabHCv5q/HG002_GRCh38_v5.0q_stvar.vcf.gz
          truth_tbi: /fsx/references/genomic_data/organism_annotations/H_sapiens/hg38/controls/giab/sv/v5.0q/HG002/giabHCv5q/HG002_GRCh38_v5.0q_stvar.vcf.gz.tbi
          truth_bed: /fsx/references/genomic_data/organism_annotations/H_sapiens/hg38/controls/giab/sv/v5.0q/HG002/giabHCv5q/HG002_GRCh38_v5.0q_stvar.benchmark.bed
